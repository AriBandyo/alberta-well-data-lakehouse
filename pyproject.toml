[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alberta-well-lakehouse"
version = "1.1.0"
description = "Official public-data Alberta well and production analytics lakehouse"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pyspark==4.0.0",
  "delta-spark==4.0.0",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "duckdb>=1.1,<2",
  "dbt-duckdb==1.10.1",
  "dagster>=1.13,<1.14",
  "dagster-webserver>=1.13,<1.14",
  "dagster-dbt>=0.29,<0.30",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "matplotlib>=3.8,<4",
]

[project.scripts]
well-lakehouse = "alberta_well_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
